name: collect

on:
  schedule:
    # Secours : GitHub retarde ou ignore ce cron. La cadence de 5 minutes vient de
    # scripts/dispatch-collect.sh (workflow_dispatch), voir CONTRIBUTING.md
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

# Aucun droit par défaut : chaque job déclare le minimum
permissions: {}

# Une collecte à la fois par ref ; on met en file plutôt que d'annuler, pour ne jamais
# interrompre un déploiement Pages en cours
concurrency:
  group: collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml
    # Le garde de tests.yml refuse tout workflow_dispatch sans SHA attendu, y compris
    # celui de ce workflow (appelé, il voit l'événement de l'appelant)
    with:
      expected_sha: ${{ github.sha }}
    permissions:
      contents: read

  collect:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # persist-credentials: false : pas de jeton dans .git/config pendant la collecte
      # de sources tierces
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Collecter les statuts
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node collect.mjs
      - name: Vérifier le JSON produit
        # Même contrat que le producteur et le navigateur, avec les identités déclarées
        run: |
          test -s public/data/status.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { assertStatusDocument, MAX_STATUS_BYTES } from './public/status-contract.js';
            const text = readFileSync('public/data/status.json', 'utf8');
            if (Buffer.byteLength(text) > MAX_STATUS_BYTES) throw new Error('status.json dépasse la borne de publication');
            assertStatusDocument(JSON.parse(text), JSON.parse(readFileSync('providers.json', 'utf8')));
          "
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public

  deploy:
    # Seule main publie : un workflow_dispatch sur une autre branche s'arrête à la collecte
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          TEST_RESULT: ${{ needs.test.result }}
        with:
          script: |
            const { publishRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/releases.mjs`);
            const result = await publishRelease({ github, context, testsPassed: process.env.TEST_RESULT === 'success' });
            if (result) core.info(`Release ${result.tag} publiée sur ${result.sha}`);

  release-pr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: current
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { canPrepareRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/releases.mjs`);
            return await canPrepareRelease({ github, context });
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        if: steps.current.outputs.result == 'true'
        with:
          target-branch: main
          skip-github-release: true
      - name: Tester la PR de version
        if: steps.current.outputs.result == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { dispatchReleaseTests } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/releases.mjs`);
            const sha = await dispatchReleaseTests({ github, context });
            if (sha) core.info(`Tests de version déclenchés sur ${sha}`);
